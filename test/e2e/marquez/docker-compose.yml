# spec 018: a Marquez for the OpenLineage e2e (test/e2e/marquez/run.sh) - its API on 127.0.0.1:5050
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 2s
      retries: 30
  api:
    image: marquezproject/marquez:0.51.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "127.0.0.1:5050:5000"

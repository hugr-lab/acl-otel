# Локальный стенд: узел -> Collector -> Loki (логи) + Prometheus (метрики) + Tempo (трейсы) -> Grafana.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {timeout: 2s}
exporters:
  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
  otlphttp/prom:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  otlphttp/tempo:
    endpoint: http://tempo:4318
  debug: {verbosity: basic}
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prom, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo, debug]

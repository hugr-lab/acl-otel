# The build community-extensions would run, run here first: the very workflow they call, with the
# same inputs. Full platform coverage (Windows MSVC/MinGW, musl, linux_arm64, ...) lives here; the
# PR loop stays on ci.yml's Linux job.
#
# Pinned like duckdb-acl: duckdb's 2.0 release branch `v2.0-cyanoptera` and extension-ci-tools `main`
# (the two load on one instance, so they share one duckdb); re-pin to the `v2.0.0` tag with the base.
name: Distribution build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: distribution-${{ github.ref }}
  # runs fill the ccache; a cancelled one leaves nothing behind for the next
  cancel-in-progress: false

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: acl_otel
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      # wasm is out: the extension ships where the base does, and an exporter is sockets
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      # The OpenTelemetry SDK pulls grpc, protobuf, abseil and curl, built for every triplet in the
      # matrix - hours from cold. duckdb-acl keeps a vcpkg binary cache on Cloudflare R2 for exactly
      # this (its docs/vcpkg-cache-r2.md), and the same bucket serves us: vcpkg keys packages by ABI
      # hash, so two extensions share it without colliding. Copy the variable VCPKG_BINARY_SOURCES
      # and the four VCPKG_CACHING_AWS_* secrets from duckdb-acl into this repository to switch it
      # on; with none of them set, `vars.VCPKG_BINARY_SOURCES` is empty and the reusable workflow
      # falls back to duckdb's public read-only cache - correct, merely slow.
      vcpkg_binary_sources: ${{ vars.VCPKG_BINARY_SOURCES }}
    secrets:
      VCPKG_CACHING_AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      VCPKG_CACHING_AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      VCPKG_CACHING_AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      VCPKG_CACHING_AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      extension_name: acl_otel
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      # `format` only. The upstream Tidy Check configures the build WITHOUT provisioning vcpkg, and
      # this extension cannot configure at all without the OpenTelemetry SDK - its CMakeLists says
      # `find_package(opentelemetry-cpp CONFIG REQUIRED)`, and the toolchain file the Makefile points
      # at is not there in that job. So it fails for a reason that is never our code. clang-tidy runs
      # in ci.yml instead, on the Linux job, where vcpkg and a compile database exist (`make tidy`).
      format_checks: 'format'
